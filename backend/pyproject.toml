[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests/unit", "tests/integration", "tests/contract", "tests/security", "tests/chaos"]
asyncio_mode = "auto"
timeout = 30

[tool.coverage.run]
source = ["api", "nats", "inference"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false

[tool.ruff]
select = ["E", "F", "W"]
ignore = ["E501"]
