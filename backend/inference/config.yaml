      model: openai/my-fake-model
      api_base: http://localhost:8080/v1
      api_key: fake-key

# ==============================================================
# 路由策略
# ==============================================================
router_settings:
  routing_strategy: usage-based-routing-v2
  allowed_fails: 3
  cooldown_time: 60
  num_retries: 2
  timeout: 30
  retry_after: 60
  model_group_alias:
    opus: local-deepseek-671b
    sonnet: qwen-plus
    haiku: qwen-turbo

# ==============================================================
# 通用设置
# ==============================================================
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: sqlite:///./litellm_proxy.db
  store_model_in_db: true
  drop_params: true

# ==============================================================
# LiteLLM 设置
# ==============================================================
litellm_settings:
  drop_params: true
  set_verbose: false
  json_logs: true
  success_callback: ["prometheus_system"]
  failure_callback: ["prometheus_system"]
  request_timeout: 60
