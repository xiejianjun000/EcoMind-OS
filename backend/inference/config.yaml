# LiteLLM 统一配置 — EcoMind OS 国产模型路由
# 支持 10+ 国产大模型，覆盖 opus/sonnet/haiku 三级路由

model_list:
  # ============================================================
  # Qwen 系列 (通义千问) — 阿里云 DashScope
  # ============================================================
  - model_name: qwen-max
    litellm_params:
      model: openai/qwen-max
      api_base: os.environ/DASHSCOPE_API_BASE
      api_key: os.environ/DASHSCOPE_API_KEY
      temperature: 0.7
      max_tokens: 8192
      stream: true
    model_info:
      mode: chat
      tier: opus
      provider: qwen

  - model_name: qwen-plus
