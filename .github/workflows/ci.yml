name: EcoMind CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * *"  # 每天凌晨 2 点跑一次夜间反思

jobs:
  # ── 第一道门：烟雾测试（30秒内跑完）──
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          python -m venv venv
          source venv/bin/activate
          pip install fastapi uvicorn pydantic httpx python-dotenv pyyaml sqlalchemy websockets aiofiles python-multipart edge-tts
      - name: Module import check
        run: |
          cd backend
          source venv/bin/activate
          PIPYTHONPATH=. python -c "from api.main import app; print('✅ FastAPI app importable')"
      - name: Configuration check
        run: |
          test -f backend/config/model_config.yaml && echo "✅ model_config.yaml exists"
          test -f backend/.env && echo "✅ .env exists" || echo "⚠️  .env missing (expected for CI)"

  # ── 第二道门：单元测试 ──
  unit:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          python -m venv venv && source venv/bin/activate
          pip install fastapi uvicorn pydantic httpx python-dotenv pyyaml sqlalchemy websockets aiofiles python-multipart edge-tts pytest pytest-asyncio pytest-timeout pytest-cov
      - name: Run unit tests
        run: |
          cd backend
          source venv/bin/activate
          python -m pytest tests/unit/ tests/contract/ -v --tb=short --timeout=30
      - name: Run security tests
        run: |
          cd backend
          source venv/bin/activate
          python -m pytest tests/security/ -v --tb=short --timeout=30

  # ── 第三道门：集成测试 ──
  integration:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          python -m venv venv && source venv/bin/activate
          pip install fastapi uvicorn pydantic httpx python-dotenv pyyaml sqlalchemy websockets pytest pytest-asyncio pytest-timeout
      - name: Start backend
        run: |
          cd backend
          source venv/bin/activate
          nohup python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/health || (echo "Backend failed to start" && exit 1)
      - name: Run integration tests
        run: |
          cd backend
          source venv/bin/activate
          python -m pytest tests/integration/ tests/chaos/ -v --tb=short --timeout=30

  # ── 第四道门：每日反思 ──
  nightly-reflection:
    if: github.event_name == 'schedule'
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run nightly reflection
        run: |
          cd backend
          python -m venv venv && source venv/bin/activate
          pip install fastapi uvicorn pydantic httpx python-dotenv pyyaml sqlalchemy
          PYTHONPATH=. python -c "
          from engine.memory_evolution import MemoryEvolution
          from engine.learning_loop import LearningLoop
          evo = MemoryEvolution()
          evo.apply_decay()
          evo.detect_conflicts()
          print('✅ Nightly reflection complete')
          "
