# EcoMind OS — CI/CD Pipeline (GitHub Actions)
# 触发条件: push → main, PR → main

name: EcoMind OS CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ═══════════════════════════════════════════════════════
  # L0: Static Analysis
  # ═══════════════════════════════════════════════════════
  static-analysis:
    name: "L0 — Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }

      - name: Python Syntax Check
        run: |
          pip install mypy ruff
          python -m compileall backend/ -q
          ruff check backend/ --select=E,F --ignore=E501 || true

      - name: Frontend Type Check
        working-directory: .github-clone/frontend
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile || true
          npx tsc --noEmit --skipLibCheck || true

  # ═══════════════════════════════════════════════════════
  # L1: Unit Tests
  # ═══════════════════════════════════════════════════════
  unit-tests:
    name: "L1 — Unit Tests"
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }

      - name: Backend Unit Tests
        working-directory: backend
        run: |
          pip install pytest pytest-asyncio pytest-cov httpx
          python -m pytest tests/unit/ tests/test_modules.py \
            -v --tb=short \
            --cov=. --cov-report=term --cov-report=xml \
            --timeout=30 \
            -p no:warnings

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ═══════════════════════════════════════════════════════
  # L2+L3: Integration + Contract Tests
  # ═══════════════════════════════════════════════════════
  integration-tests:
    name: "L2+L3 — Integration & Contract"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }

      - name: Install Dependencies
        run: |
          pip install fastapi uvicorn httpx pytest pytest-asyncio

      - name: Start Backend Server
        working-directory: backend
        run: |
          python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -s http://localhost:8000/health

      - name: Run Integration Tests
        working-directory: backend
        run: |
          python -m pytest tests/integration/ -v --tb=short -p no:warnings || true

      - name: Run Contract Tests
        working-directory: backend
        run: |
          python -m pytest tests/contract/ -v --tb=short -p no:warnings

  # ═══════════════════════════════════════════════════════
  # L6: Security Tests
  # ═══════════════════════════════════════════════════════
  security-tests:
    name: "L6 — Security Tests"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }

      - name: Run Security Tests
        working-directory: backend
        run: |
          pip install pytest pytest-asyncio httpx
          python -m pytest tests/security/ -v --tb=short -p no:warnings

  # ═══════════════════════════════════════════════════════
  # L5: Performance Tests (Release only)
  # ═══════════════════════════════════════════════════════
  performance-tests:
    name: "L5 — Performance Tests"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }

      - name: Install Dependencies
        run: |
          pip install fastapi uvicorn httpx

      - name: Start Server
        working-directory: backend
        run: |
          python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Run Performance Smoke Test
        working-directory: backend
        run: |
          python -m tests.stress.runner --mode smoke --base-url http://localhost:8000
