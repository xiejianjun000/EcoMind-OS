<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" fill="#050A0E"/>

  <!-- Red circle — enforcement trigger indicator -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="#EF4444" stroke-width="2.5" filter="url(#redGlow)" opacity="0.9"/>
  <circle cx="60" cy="60" r="44" fill="#EF4444" opacity="0.08"/>

  <!-- Inner ring -->
  <circle cx="60" cy="60" r="36" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.4"/>

  <!-- Gavel icon — simplified white line icon -->
  <g filter="url(#iconGlow)" transform="translate(60, 60)">
    <!-- Gavel head -->
    <rect x="-14" y="-18" width="28" height="10" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Gavel handle -->
    <line x1="0" y1="-8" x2="0" y2="16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <!-- Gavel strike base -->
    <line x1="-10" y1="16" x2="10" y2="16" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Impact lines -->
    <line x1="-8" y1="20" x2="-14" y2="24" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <line x1="0" y1="21" x2="0" y2="26" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <line x1="8" y1="20" x2="14" y2="24" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>