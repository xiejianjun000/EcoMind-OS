<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="ringGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background transparent -->
  <rect width="100" height="100" fill="none"/>

  <!-- Track (background ring) -->
  <circle cx="50" cy="50" r="42"
          stroke="#0E7490" stroke-width="4" fill="none" opacity="0.3"/>

  <!-- Progress arc — 83% filled (for production readiness) -->
  <!-- circumference = 2 * π * 42 ≈ 263.89, 83% = 219.03 -->
  <circle cx="50" cy="50" r="42"
          stroke="#00C9A7" stroke-width="4" fill="none"
          stroke-dasharray="219.03 263.89"
          stroke-linecap="round"
          transform="rotate(-90 50 50)"
          filter="url(#ringGlow)"/>

  <!-- Center percentage text (optional, can be removed) -->
  <text x="50" y="47" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="300" fill="#FFFFFF">83%</text>
  <text x="50" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="300" fill="#00C9A7" opacity="0.7">READY</text>
</svg>