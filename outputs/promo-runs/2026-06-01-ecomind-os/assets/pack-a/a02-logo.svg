<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="brainGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C9A7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00C9A7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="veinGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="50%" stop-color="#00C9A7"/>
      <stop offset="100%" stop-color="#00C9A7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#050A0E"/>

  <!-- Central radial aura — brain glow -->
  <circle cx="256" cy="256" r="160" fill="url(#brainGrad)"/>

  <!-- Leaf outline — the overall leaf shape that contains the neural network -->
  <path d="M 256 60 C 300 80, 390 140, 420 230 C 440 295, 425 360, 390 400 C 360 435, 310 460, 256 465 C 202 460, 152 435, 122 400 C 87 360, 72 295, 92 230 C 122 140, 212 80, 256 60 Z"
        stroke="#00C9A7" stroke-width="1.2" fill="none" opacity="0.25" filter="url(#subtleGlow)"/>

  <!-- Main midrib — central vein / axon -->
  <path d="M 256 465 C 256 420, 256 370, 256 320 C 256 270, 256 220, 256 170 C 256 130, 256 90, 256 60"
        stroke="url(#veinGrad)" stroke-width="2.5" fill="none" filter="url(#logoGlow)"
        stroke-linecap="round"/>

  <!-- Primary veins / neural pathways — branching from midrib -->

  <!-- Left upper vein cluster -->
  <path d="M 256 170 C 235 155, 200 135, 165 120 C 140 110, 118 105, 100 108"
        stroke="#00C9A7" stroke-width="1.8" fill="none" filter="url(#subtleGlow)" opacity="0.9"
        stroke-linecap="round"/>
  <path d="M 256 200 C 230 190, 195 175, 158 165 C 135 158, 112 155, 92 160"
        stroke="#00C9A7" stroke-width="1.8" fill="none" filter="url(#subtleGlow)" opacity="0.9"
        stroke-linecap="round"/>

  <!-- Left lower vein cluster -->
  <path d="M 256 320 C 230 335, 195 355, 155 370 C 130 380, 108 384, 90 382"
        stroke="#00C9A7" stroke-width="1.8" fill="none" filter="url(#subtleGlow)" opacity="0.9"
        stroke-linecap="round"/>
  <path d="M 256 350 C 235 365, 205 385, 170 400 C 145 410, 122 414, 105 412"
        stroke="#00C9A7" stroke-width="1.8" fill="none" filter="url(#subtleGlow)" opacity="0.9"
        stroke-linecap="round"/>

  <!-- Right upper vein cluster -->
  <path d="M 256 170 C 277 155, 312 135, 347 120 C 372 110, 394 105, 412 108"
        stroke="#00C9A7" stroke-width="1.8" fill="none" filter="url(#subtleGlow)" opacity="0.9"
        stroke-linecap="round"/>
  <path d="M 256 200 C 282 190, 317 175, 354 165 C 377 158, 400 155, 420 160"
        stroke="#00C9A7" stroke-width="1.8" fill="none" filter="url(#subtleGlow)" opacity="0.9"
        stroke-linecap="round"/>

  <!-- Right lower vein cluster -->
  <path d="M 256 320 C 282 335, 317 355, 357 370 C 382 380, 404 384, 422 382"
        stroke="#00C9A7" stroke-width="1.8" fill="none" filter="url(#subtleGlow)" opacity="0.9"
        stroke-linecap="round"/>
  <path d="M 256 350 C 277 365, 307 385, 342 400 C 367 410, 390 414, 407 412"
        stroke="#00C9A7" stroke-width="1.8" fill="none" filter="url(#subtleGlow)" opacity="0.9"
        stroke-linecap="round"/>

  <!-- Secondary veins / dendrite extensions -->
  <path d="M 200 135 C 188 120, 172 112, 155 108" stroke="#00C9A7" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 195 175 C 180 168, 162 163, 145 162" stroke="#00C9A7" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 195 355 C 180 362, 162 368, 145 370" stroke="#00C9A7" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 205 385 C 190 392, 172 398, 155 400" stroke="#00C9A7" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 312 135 C 324 120, 340 112, 357 108" stroke="#00C9A7" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 317 175 C 332 168, 350 163, 367 162" stroke="#00C9A7" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 317 355 C 332 362, 350 368, 367 370" stroke="#00C9A7" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 307 385 C 322 392, 340 398, 357 400" stroke="#00C9A7" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- Neural network nodes — synapse points along the midrib -->
  <circle cx="256" cy="170" r="6" fill="#00C9A7" filter="url(#logoGlow)" opacity="0.95"/>
  <circle cx="256" cy="200" r="5" fill="#00C9A7" filter="url(#logoGlow)" opacity="0.85"/>
  <circle cx="256" cy="256" r="7" fill="#00C9A7" filter="url(#outerGlow)" opacity="1"/>
  <circle cx="256" cy="320" r="5" fill="#00C9A7" filter="url(#logoGlow)" opacity="0.85"/>
  <circle cx="256" cy="350" r="6" fill="#00C9A7" filter="url(#logoGlow)" opacity="0.95"/>

  <!-- Branch junction nodes -->
  <circle cx="165" cy="120" r="3.5" fill="#0E7490" filter="url(#subtleGlow)" opacity="0.8"/>
  <circle cx="158" cy="165" r="3.5" fill="#0E7490" filter="url(#subtleGlow)" opacity="0.8"/>
  <circle cx="155" cy="370" r="3.5" fill="#0E7490" filter="url(#subtleGlow)" opacity="0.8"/>
  <circle cx="170" cy="400" r="3.5" fill="#0E7490" filter="url(#subtleGlow)" opacity="0.8"/>
  <circle cx="347" cy="120" r="3.5" fill="#0E7490" filter="url(#subtleGlow)" opacity="0.8"/>
  <circle cx="354" cy="165" r="3.5" fill="#0E7490" filter="url(#subtleGlow)" opacity="0.8"/>
  <circle cx="357" cy="370" r="3.5" fill="#0E7490" filter="url(#subtleGlow)" opacity="0.8"/>
  <circle cx="342" cy="400" r="3.5" fill="#0E7490" filter="url(#subtleGlow)" opacity="0.8"/>

  <!-- Terminal nodes — dendrite endpoints -->
  <circle cx="100" cy="108" r="2.5" fill="#00C9A7" opacity="0.6"/>
  <circle cx="92" cy="160" r="2.5" fill="#00C9A7" opacity="0.6"/>
  <circle cx="90" cy="382" r="2.5" fill="#00C9A7" opacity="0.6"/>
  <circle cx="105" cy="412" r="2.5" fill="#00C9A7" opacity="0.6"/>
  <circle cx="412" cy="108" r="2.5" fill="#00C9A7" opacity="0.6"/>
  <circle cx="420" cy="160" r="2.5" fill="#00C9A7" opacity="0.6"/>
  <circle cx="422" cy="382" r="2.5" fill="#00C9A7" opacity="0.6"/>
  <circle cx="407" cy="412" r="2.5" fill="#00C9A7" opacity="0.6"/>

  <!-- Cross-connections — neural network horizontal links (the "AI" aspect) -->
  <path d="M 165 120 C 180 135, 200 145, 220 148" stroke="#0E7490" stroke-width="0.7" fill="none" opacity="0.35" stroke-linecap="round" stroke-dasharray="3,3"/>
  <path d="M 347 120 C 332 135, 312 145, 292 148" stroke="#0E7490" stroke-width="0.7" fill="none" opacity="0.35" stroke-linecap="round" stroke-dasharray="3,3"/>
  <path d="M 158 165 C 180 175, 210 182, 240 185" stroke="#0E7490" stroke-width="0.7" fill="none" opacity="0.35" stroke-linecap="round" stroke-dasharray="3,3"/>
  <path d="M 354 165 C 332 175, 302 182, 272 185" stroke="#0E7490" stroke-width="0.7" fill="none" opacity="0.35" stroke-linecap="round" stroke-dasharray="3,3"/>
  <path d="M 155 370 C 175 360, 210 352, 240 348" stroke="#0E7490" stroke-width="0.7" fill="none" opacity="0.35" stroke-linecap="round" stroke-dasharray="3,3"/>
  <path d="M 357 370 C 337 360, 302 352, 272 348" stroke="#0E7490" stroke-width="0.7" fill="none" opacity="0.35" stroke-linecap="round" stroke-dasharray="3,3"/>
  <path d="M 170 400 C 190 392, 220 386, 242 383" stroke="#0E7490" stroke-width="0.7" fill="none" opacity="0.35" stroke-linecap="round" stroke-dasharray="3,3"/>
  <path d="M 342 400 C 322 392, 292 386, 270 383" stroke="#0E7490" stroke-width="0.7" fill="none" opacity="0.35" stroke-linecap="round" stroke-dasharray="3,3"/>

  <!-- Central pulse ring — the "thinking" brain indicator -->
  <circle cx="256" cy="256" r="20" stroke="#00C9A7" stroke-width="0.8" fill="none" opacity="0.4"/>
  <circle cx="256" cy="256" r="35" stroke="#00C9A7" stroke-width="0.5" fill="none" opacity="0.2"/>
  <circle cx="256" cy="256" r="50" stroke="#00C9A7" stroke-width="0.3" fill="none" opacity="0.1"/>
</svg>