<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 32" width="192" height="32">
  <!-- 6 skill icons, each 24x24 with 8px spacing -->
  <!-- Background transparent -->

  <!-- Icon 1: 雷达 (Radar) — 24x24 at x=4 -->
  <g transform="translate(4, 4)" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M 12 4 C 7.6 4, 4 7.6, 4 12"/>
    <path d="M 12 20 C 16.4 20, 20 16.4, 20 12"/>
    <path d="M 4 12 L 1 12"/>
    <path d="M 20 12 L 23 12"/>
    <path d="M 12 4 L 12 1"/>
    <path d="M 12 20 L 12 23"/>
  </g>

  <!-- Icon 2: 工厂 (Factory) — 24x24 at x=36 -->
  <g transform="translate(36, 4)" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 3 20 L 3 10 L 8 14 L 8 10 L 13 14 L 13 4 L 21 4 L 21 20"/>
    <rect x="15" y="8" width="3" height="3" rx="0.5"/>
    <rect x="6" y="16" width="3" height="4" rx="0.5"/>
    <line x1="1" y1="20" x2="23" y2="20"/>
  </g>

  <!-- Icon 3: 法槌 (Gavel) — 24x24 at x=68 -->
  <g transform="translate(68, 4)" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="4" width="12" height="5" rx="1.5"/>
    <line x1="12" y1="9" x2="12" y2="17"/>
    <line x1="6" y1="17" x2="18" y2="17"/>
    <line x1="8" y1="19" x2="5" y2="22"/>
    <line x1="12" y1="19" x2="12" y2="22"/>
    <line x1="16" y1="19" x2="19" y2="22"/>
  </g>

  <!-- Icon 4: 文件 (Document) — 24x24 at x=100 -->
  <g transform="translate(100, 4)" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 6 2 L 6 22 L 18 22 L 18 8 L 12 2 Z"/>
    <polyline points="12,2 12,8 18,8"/>
    <line x1="9" y1="12" x2="15" y2="12"/>
    <line x1="9" y1="16" x2="15" y2="16"/>
  </g>

  <!-- Icon 5: 图表 (Chart) — 24x24 at x=132 -->
  <g transform="translate(132, 4)" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="20" x2="21" y2="20"/>
    <line x1="3" y1="20" x2="3" y2="4"/>
    <polyline points="6,16 10,10 14,13 20,6"/>
    <circle cx="20" cy="6" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Icon 6: 盾牌 (Shield) — 24x24 at x=164 -->
  <g transform="translate(164, 4)" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 2 L 3 6 L 3 12 C 3 17.5 7 21.5 12 23 C 17 21.5 21 17.5 21 12 L 21 6 Z"/>
    <polyline points="8,12 11,15 16,9"/>
  </g>
</svg>