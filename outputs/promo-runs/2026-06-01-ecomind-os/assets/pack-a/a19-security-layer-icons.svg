<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 16" width="128" height="16">
  <!-- 6 security layer icons, each 16x16 with ~5px spacing -->
  <!-- Background transparent -->

  <!-- Icon 1: 漏斗 (Funnel / Input Filter) — 16x16 at x=0 -->
  <g transform="translate(0, 0)" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 2 3 L 14 3 L 9.5 9 L 9.5 13 L 6.5 13 L 6.5 9 Z"/>
  </g>

  <!-- Icon 2: 钥匙 (Key / Permission) — 16x16 at x=21 -->
  <g transform="translate(21, 0)" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="5.5" cy="5.5" r="3.5"/>
    <line x1="8" y1="8" x2="14" y2="14"/>
    <line x1="12" y1="12" x2="14" y2="12"/>
    <line x1="10" y1="10" x2="12" y2="10"/>
  </g>

  <!-- Icon 3: 锁 (Lock / Encryption) — 16x16 at x=42 -->
  <g transform="translate(42, 0)" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="7" width="10" height="7" rx="1.5"/>
    <path d="M 5.5 7 L 5.5 5 C 5.5 3.1 7 1.5 8 1.5 C 9 1.5 10.5 3.1 10.5 5 L 10.5 7"/>
    <circle cx="8" cy="10.5" r="1" fill="#FFFFFF"/>
  </g>

  <!-- Icon 4: 文档 (Document / Compliance) — 16x16 at x=63 -->
  <g transform="translate(63, 0)" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 4 1.5 L 4 14.5 L 12 14.5 L 12 5.5 L 8 1.5 Z"/>
    <polyline points="8,1.5 8,5.5 12,5.5"/>
    <line x1="6" y1="8" x2="10" y2="8"/>
    <line x1="6" y1="10.5" x2="10" y2="10.5"/>
  </g>

  <!-- Icon 5: 路径 (Path / Audit Trail) — 16x16 at x=84 -->
  <g transform="translate(84, 0)" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="3" cy="8" r="2"/>
    <circle cx="13" cy="3" r="2"/>
    <circle cx="13" cy="13" r="2"/>
    <path d="M 5 7 L 11 4"/>
    <path d="M 5 9 L 11 12"/>
  </g>

  <!-- Icon 6: 盾牌检查 (Shield Check / Verification) — 16x16 at x=105 -->
  <g transform="translate(105, 0)" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8 1 L 2 3.5 L 2 8 C 2 11.5 4.7 14 8 15 C 11.3 14 14 11.5 14 8 L 14 3.5 Z"/>
    <polyline points="5.5,8 7,9.5 10.5,6"/>
  </g>
</svg>