<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#050A0E"/>

  <!-- Main vein — the primary midrib of the leaf, also the central axon of the neural network -->
  <path d="M 120 460 C 180 420, 260 360, 340 300 C 420 240, 500 200, 580 180 C 660 160, 740 150, 840 140"
        stroke="#00C9A7" stroke-width="2.5" fill="none" filter="url(#glow)"
        stroke-linecap="round"/>

  <!-- Branch 1 — upper-left, neural dendrite -->
  <path d="M 200 430 C 220 400, 230 370, 240 330 C 248 300, 244 270, 238 240"
        stroke="#00C9A7" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.85"
        stroke-linecap="round"/>

  <!-- Branch 2 — lower-left, leaf vein curving down -->
  <path d="M 220 418 C 240 440, 270 460, 310 475 C 340 484, 370 488, 400 486"
        stroke="#00C9A7" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.85"
        stroke-linecap="round"/>

  <!-- Branch 3 — upper-mid left -->
  <path d="M 300 320 C 310 290, 325 260, 345 230 C 358 210, 370 195, 390 178"
        stroke="#00C9A7" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.85"
        stroke-linecap="round"/>

  <!-- Branch 4 — lower-mid left -->
  <path d="M 310 315 C 330 340, 360 365, 400 385 C 430 398, 460 405, 490 408"
        stroke="#00C9A7" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.85"
        stroke-linecap="round"/>

  <!-- Branch 5 — upper-center -->
  <path d="M 440 240 C 448 210, 460 180, 480 155 C 495 138, 510 125, 530 115"
        stroke="#00C9A7" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.85"
        stroke-linecap="round"/>

  <!-- Branch 6 — lower-center -->
  <path d="M 460 228 C 478 255, 505 280, 540 300 C 565 314, 590 322, 620 325"
        stroke="#00C9A7" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.85"
        stroke-linecap="round"/>

  <!-- Branch 7 — upper-mid right -->
  <path d="M 560 188 C 565 158, 578 130, 600 108 C 615 93, 630 82, 650 75"
        stroke="#00C9A7" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.85"
        stroke-linecap="round"/>

  <!-- Branch 8 — lower-mid right -->
  <path d="M 575 182 C 592 205, 618 228, 650 245 C 672 256, 695 262, 720 264"
        stroke="#00C9A7" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.85"
        stroke-linecap="round"/>

  <!-- Branch 9 — upper-right -->
  <path d="M 680 158 C 688 130, 702 105, 720 85 C 735 70, 748 60, 765 52"
        stroke="#00C9A7" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.85"
        stroke-linecap="round"/>

  <!-- Branch 10 — lower-right -->
  <path d="M 690 155 C 708 178, 732 200, 760 215 C 780 225, 800 230, 825 232"
        stroke="#00C9A7" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.85"
        stroke-linecap="round"/>

  <!-- Branch 11 — far upper-right -->
  <path d="M 790 144 C 800 118, 818 95, 840 78 C 855 67, 868 60, 885 55"
        stroke="#00C9A7" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.85"
        stroke-linecap="round"/>

  <!-- Branch 12 — far lower-right -->
  <path d="M 798 142 C 815 165, 840 185, 870 198 C 890 206, 910 210, 930 212"
        stroke="#00C9A7" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.85"
        stroke-linecap="round"/>

  <!-- Neural network nodes — at branch junction points on main vein -->
  <circle cx="200" cy="430" r="4" fill="#00C9A7" filter="url(#outerGlow)" opacity="0.9"/>
  <circle cx="220" cy="418" r="3.5" fill="#00C9A7" filter="url(#glow)" opacity="0.7"/>
  <circle cx="300" cy="320" r="4" fill="#00C9A7" filter="url(#outerGlow)" opacity="0.9"/>
  <circle cx="310" cy="315" r="3.5" fill="#00C9A7" filter="url(#glow)" opacity="0.7"/>
  <circle cx="440" cy="240" r="4" fill="#00C9A7" filter="url(#outerGlow)" opacity="0.9"/>
  <circle cx="460" cy="228" r="3.5" fill="#00C9A7" filter="url(#glow)" opacity="0.7"/>
  <circle cx="560" cy="188" r="4" fill="#00C9A7" filter="url(#outerGlow)" opacity="0.9"/>
  <circle cx="575" cy="182" r="3.5" fill="#00C9A7" filter="url(#glow)" opacity="0.7"/>
  <circle cx="680" cy="158" r="4" fill="#00C9A7" filter="url(#outerGlow)" opacity="0.9"/>
  <circle cx="690" cy="155" r="3.5" fill="#00C9A7" filter="url(#glow)" opacity="0.7"/>
  <circle cx="790" cy="144" r="4" fill="#00C9A7" filter="url(#outerGlow)" opacity="0.9"/>
  <circle cx="798" cy="142" r="3.5" fill="#00C9A7" filter="url(#glow)" opacity="0.7"/>

  <!-- Terminal nodes — at branch endpoints -->
  <circle cx="238" cy="240" r="2.5" fill="#0E7490" filter="url(#glow)" opacity="0.8"/>
  <circle cx="400" cy="486" r="2.5" fill="#0E7490" filter="url(#glow)" opacity="0.8"/>
  <circle cx="390" cy="178" r="2.5" fill="#0E7490" filter="url(#glow)" opacity="0.8"/>
  <circle cx="490" cy="408" r="2.5" fill="#0E7490" filter="url(#glow)" opacity="0.8"/>
  <circle cx="530" cy="115" r="2.5" fill="#0E7490" filter="url(#glow)" opacity="0.8"/>
  <circle cx="620" cy="325" r="2.5" fill="#0E7490" filter="url(#glow)" opacity="0.8"/>
  <circle cx="650" cy="75" r="2.5" fill="#0E7490" filter="url(#glow)" opacity="0.8"/>
  <circle cx="720" cy="264" r="2.5" fill="#0E7490" filter="url(#glow)" opacity="0.8"/>
  <circle cx="765" cy="52" r="2.5" fill="#0E7490" filter="url(#glow)" opacity="0.8"/>
  <circle cx="825" cy="232" r="2.5" fill="#0E7490" filter="url(#glow)" opacity="0.8"/>
  <circle cx="885" cy="55" r="2.5" fill="#0E7490" filter="url(#glow)" opacity="0.8"/>
  <circle cx="930" cy="212" r="2.5" fill="#0E7490" filter="url(#glow)" opacity="0.8"/>

  <!-- Sub-branches (tertiary veins / neural dendrites) for added complexity -->
  <path d="M 248 290 C 255 275, 265 265, 275 258" stroke="#00C9A7" stroke-width="0.8" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 340 290 C 348 278, 358 272, 370 268" stroke="#00C9A7" stroke-width="0.8" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 355 365 C 365 358, 378 355, 390 354" stroke="#00C9A7" stroke-width="0.8" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 478 175 C 485 165, 495 160, 505 157" stroke="#00C9A7" stroke-width="0.8" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 510 280 C 518 273, 530 270, 542 269" stroke="#00C9A7" stroke-width="0.8" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 600 128 C 610 122, 622 118, 632 116" stroke="#00C9A7" stroke-width="0.8" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 630 235 C 640 230, 652 228, 662 227" stroke="#00C9A7" stroke-width="0.8" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 725 100 C 735 95, 745 92, 755 91" stroke="#00C9A7" stroke-width="0.8" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 755 218 C 765 214, 775 212, 785 211" stroke="#00C9A7" stroke-width="0.8" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 845 90 C 852 86, 860 84, 868 83" stroke="#00C9A7" stroke-width="0.8" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 865 198 C 875 194, 885 192, 893 191" stroke="#00C9A7" stroke-width="0.8" fill="none" opacity="0.5" stroke-linecap="round"/>
</svg>