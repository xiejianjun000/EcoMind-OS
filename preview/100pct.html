<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EcoMind OS — 100% WorkBuddy 对标</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#0f0f17;--bg3:#15151f;--bg-hover:#1c1c2a;--bg-active:#1e1e30;
  --bd:#1e1e30;--bd2:#2a2a40;--tx:#e4e4ec;--tx2:#9090a8;--tx3:#606078;
  --grn:#10b981;--grn-bg:rgba(16,185,129,0.12);--blu:#3b82f6;--amb:#f59e0b;--red:#ef4444;--pur:#8b5cf6;
  --r:8px;--rr:12px;
}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}

.topbar{height:38px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:8px;flex-shrink:0}
.top-dot{width:7px;height:7px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px rgba(16,185,129,0.4)}
.top-logo{font-size:13px;font-weight:700;color:var(--grn)}
.top-model{font-size:11px;padding:2px 10px;border-radius:10px;background:var(--grn-bg);color:var(--grn);margin-left:auto;font-weight:500}
.top-user{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#4f46e5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;cursor:pointer}
.main{display:flex;flex:1;overflow:hidden}

.sidebar{width:48px;min-width:48px;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;flex-shrink:0;transition:width 0.2s;z-index:10}
.sidebar:hover{width:185px}
.sidebar:hover .nl{display:inline}
.sidebar:hover .ni{justify-content:flex-start;padding:8px 10px;width:calc(100% - 6px)}
.ni{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:7px;cursor:pointer;color:var(--tx2);font-size:15px;transition:all 0.15s;white-space:nowrap;overflow:hidden;position:relative}
.ni:hover{background:var(--bg-hover);color:var(--tx)}
.ni.ac{background:var(--grn-bg);color:var(--grn)}
.nl{font-size:12px;font-weight:500;margin-left:8px;display:none}
.nb{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.ns{width:20px;height:1px;background:var(--bd);margin:3px 0;flex-shrink:0}
.sb{margin-top:auto}

.sub{width:260px;min-width:260px;background:var(--bg3);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.sh{padding:10px 14px;border-bottom:1px solid var(--bd);font-size:13px;font-weight:600;flex-shrink:0;display:flex;align-items:center;gap:6px}
.ss{flex:1;overflow-y:auto;padding:6px}
.ss::-webkit-scrollbar{width:4px}
.ss::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}

.gt{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:1.5px;padding:10px 6px 4px}
.ei{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;transition:all 0.15s;font-size:12px}
.ei:hover{background:var(--bg-hover)}
.ei.ac{background:var(--grn-bg);border:1px solid rgba(16,185,129,0.2)}
.ea{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.eif{flex:1;min-width:0}
.en{font-size:12px;font-weight:500}
.er{font-size:10px;color:var(--tx2)}
.lv{font-size:8px;padding:1px 5px;border-radius:8px;font-weight:600}
.lv3{background:rgba(239,68,68,0.12);color:var(--red)}
.lv2{background:rgba(245,158,11,0.12);color:var(--amb)}
.lv1{background:rgba(16,185,129,0.12);color:var(--grn)}

.tc{padding:8px;background:var(--bg2);border:1px solid var(--bd);border-radius:7px;margin:3px 0;cursor:pointer}
.tc:hover{border-color:var(--blu)}
.tcn{font-size:11px;font-weight:600;margin-bottom:2px}
.tcd{display:flex;gap:2px;align-items:center}
.tcdt{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff}
.tcp{height:3px;background:var(--bd);border-radius:3px;margin-top:5px;overflow:hidden}
.tcpb{height:100%;background:var(--grn);border-radius:3px}

.qc{padding:10px;background:var(--bg2);border:1px solid var(--bd);border-radius:7px;margin:3px 0;cursor:pointer;transition:all 0.15s}
.qc:hover{border-color:var(--grn)}
.qct{font-size:11px;font-weight:600;margin-bottom:2px}
.qcd{font-size:10px;color:var(--tx2)}

.si{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:11px;transition:all 0.15s}
.si:hover{background:var(--bg-hover)}
.sic{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}

.ai{padding:8px;background:var(--bg2);border:1px solid var(--bd);border-radius:7px;margin:3px 0}
.an{font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px}
.as{font-size:9px;padding:1px 6px;border-radius:6px;margin-left:auto}
.as.act{background:rgba(16,185,129,0.12);color:var(--grn)}
.as.pau{background:rgba(245,158,11,0.12);color:var(--amb)}
.asc{font-size:10px;color:var(--tx2);margin-top:2px}

.note-item{padding:6px 8px;border-radius:6px;cursor:pointer;font-size:11px;transition:all 0.15s}
.note-item:hover{background:var(--bg-hover)}
.note-item .nt{font-weight:500}
.note-item .nd{font-size:9px;color:var(--tx3)}

.seti{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:12px;border-radius:6px;margin:2px 6px;transition:all 0.15s}
.seti:hover{background:var(--bg-hover)}
.setii{font-size:14px;color:var(--tx2);width:20px;text-align:center}
.ucard{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.ua{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#4f46e5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
.un{font-size:13px;font-weight:600}
.ue{font-size:10px;color:var(--tx2)}

.hs{padding:8px;background:var(--bg2);border:1px solid var(--bd);border-radius:7px;margin-bottom:8px;display:flex;align-items:center;gap:4px}
.hs input{flex:1;background:none;border:none;color:var(--tx);font-size:11px;outline:none;min-width:0}
.hs input::placeholder{color:var(--tx3)}

.chat{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0}
.cbar{height:40px;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0}
.ctitle{font-size:13px;font-weight:600}
.csub{font-size:10px;color:var(--tx2);padding:2px 7px;background:var(--bg2);border-radius:6px}
.cmodes{display:flex;margin-left:auto;gap:3px}
.cm{padding:3px 10px;border-radius:5px;font-size:10px;cursor:pointer;border:1px solid var(--bd);background:var(--bg2);color:var(--tx2)}
.cm:hover{color:var(--tx)}
.cm.on{background:var(--grn-bg);border-color:rgba(16,185,129,0.3);color:var(--grn)}

.cmsgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.cmsgs::-webkit-scrollbar{width:4px}
.cmsgs::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
.msg{display:flex;gap:8px;max-width:85%;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.u{align-self:flex-end;flex-direction:row-reverse}
.ma{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.mb{padding:8px 12px;border-radius:9px;font-size:12px;line-height:1.6;background:var(--bg3);border:1px solid var(--bd)}
.msg.u .mb{background:var(--bg2)}
.mt{font-size:9px;color:var(--tx3);margin-top:3px}
.thk{background:rgba(139,92,246,0.06);border:1px solid rgba(139,92,246,0.15);border-radius:5px;padding:6px 10px;font-size:10px;color:var(--tx2);margin:5px 0}
.thk summary{font-weight:600;color:var(--pur);font-size:9px;cursor:pointer}
.hal{display:inline-flex;gap:3px;background:rgba(239,68,68,0.1);color:var(--red);font-size:9px;padding:2px 6px;border-radius:6px;margin-top:4px}

.cinp{border-top:1px solid var(--bd);padding:8px 12px 10px;background:var(--bg2);flex-shrink:0}
.ctl{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.tb{padding:2px 8px;border-radius:5px;font-size:9px;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--tx2);transition:all 0.15s}
.tb:hover{color:var(--tx)}
.tb.on{border-color:var(--grn);color:var(--grn);background:var(--grn-bg)}
.cir{display:flex;gap:6px;align-items:flex-end}
.ci{flex:1;min-height:34px;max-height:90px;padding:6px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:12px;font-family:inherit;resize:none;outline:none}
.ci:focus{border-color:var(--grn)}
.ci::placeholder{color:var(--tx3)}
.cs{width:34px;height:34px;background:var(--grn);border:none;border-radius:8px;color:#fff;font-size:15px;cursor:pointer;flex-shrink:0}

.right{width:320px;min-width:320px;background:var(--bg3);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.rtabs{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0}
.rt{flex:1;padding:9px 0;text-align:center;font-size:10px;font-weight:500;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s;background:none;border-top:none;border-left:none;border-right:none}
.rt:hover{color:var(--tx)}
.rt.on{color:var(--grn);border-bottom-color:var(--grn)}
.rc{flex:1;overflow-y:auto;padding:10px}
.rc::-webkit-scrollbar{width:4px}
.rc::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}

.rcard{padding:10px;background:var(--bg2);border:1px solid var(--bd);border-radius:7px;margin-bottom:7px}
.rcard:hover{border-color:var(--bd2)}
.rch{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.rci{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.rct{font-size:11px;font-weight:600}
.rcd{font-size:10px;color:var(--tx2);line-height:1.4}
.rcm{display:flex;gap:10px;margin-top:5px;font-size:9px;color:var(--tx3)}
.rcst{font-size:9px;padding:1px 5px;border-radius:5px;margin-left:auto}
.rcst.done{background:rgba(16,185,129,0.1);color:var(--grn)}
.rcst.run{background:rgba(59,130,246,0.1);color:var(--blu);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.rcprog{height:3px;background:var(--bd);border-radius:2px;margin-top:6px;overflow:hidden}
.rcprogb{height:100%;background:var(--blu);border-radius:2px}

.lg{padding:6px 0 6px 10px;border-left:2px solid var(--bd);margin-bottom:4px;font-size:10px}
.lg.ok{border-left-color:var(--grn)}
.lg.wn{border-left-color:var(--amb)}
.lg.er{border-left-color:var(--red)}
.lgt{font-size:9px;color:var(--tx3)}
.lgtx{color:var(--tx2);margin-top:1px;line-height:1.4}

.hist{padding:6px 8px;border-radius:5px;cursor:pointer;font-size:11px;margin-bottom:3px}
.hist:hover{background:var(--bg-hover)}
.hist .htt{font-weight:500}
.hist .htm{font-size:9px;color:var(--tx3)}

.ebar{font-size:9px;color:var(--tx3);padding:4px 12px;border-top:1px solid var(--bd);display:flex;gap:16px;background:var(--bg2);flex-shrink:0}
.ebar span{display:flex;align-items:center;gap:3px}
.ed{width:5px;height:5px;border-radius:50%;display:inline-block}
.ed.g{background:var(--grn)}.ed.y{background:var(--amb)}.ed.r{background:var(--red)}
</style>
</head>
<body>
<div class="app">

<div class="topbar">

<div class="main">

  </div>
</main>

<!-- Right Panel -->
<aside class="right" id="rightPanel">
  <div class="rtabs">
    <button class="rt on" data-rt="exec" onclick="rtab('exec',this)">📊 执行</button>
    <button class="rt" data-rt="result" onclick="rtab('result',this)">📄 结果</button>
    <button class="rt" data-rt="log" onclick="rtab('log',this)">📝 日志</button>
    <button class="rt" data-rt="history" onclick="rtab('history',this)">🔍 历史</button>
  </div>
  <div class="rc" id="rightContent"></div>
  <div class="ebar">
    <span><span class="ed g"></span>L3-本地</span>
    <span><span class="ed g"></span>API:42ms</span>
    <span><span class="ed g"></span>WS:🟢</span>
    <span style="margin-left:auto">GB/T 3565</span>
  </div>
</aside>

</div></div>

// ============= RENDER =============
function nav(target) {
  S.nav = target;
  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('ac'));
  document.querySelector(`[data-nav="${target}"]`)?.classList.add('ac');
  renderSub();
}

function rtab(target, el) {
  S.rtab = target;
  document.querySelectorAll('.rt').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  renderRight();
}

function setMode(m, el) {
  S.mode = m;
  document.querySelectorAll('.cm').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}

// Render Chat Messages
function renderChat() {
  const el = document.getElementById('chatMsgs');
  let html = '';
  S.msgs.forEach(m=>{
    const isUser = m.type === 'user';
    html += `<div class="msg ${isUser?'u':''}"><div class="ma" style="background:linear-gradient(135deg,${m.color})">${m.from[0]}</div><div><div class="mb">${m.text}</div><div class="mt">${m.time}</div></div></div>`;
  });
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  S.msgs.push({type:'user',from:'军哥',color:'#6366f1,#4f46e5',text,time:new Date().toLocaleTimeString('zh',{hour:'2-digit',minute:'2-digit'})});
  input.value = '';
  renderChat();
  // Simulate response
  setTimeout(()=>{
    S.msgs.push({type:'system',from:'GAIA 主控',color:'#10b981,#059669',text:'收到。正在调度相关专家进行分析...<span class="hal">⚡ 实时处理中</span>',time:new Date().toLocaleTimeString('zh',{hour:'2-digit',minute:'2-digit'})});
    renderChat();
    S.logs.unshift({lv:'ok',t:new Date().toLocaleTimeString('zh',{hour:'2-digit',minute:'2-digit'}),tx:'✅ 用户 — 新消息已处理'});
    renderRight();
  },800);
}

function selExpert(id) {
  S.activeExpert = id;
  const e = S.experts.find(x=>x.id===id);
  if(e) {
    document.getElementById('chatInput').value = `@${e.n} `;
    document.getElementById('chatInput').focus();
  }
  renderSub();
}
