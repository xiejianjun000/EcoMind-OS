# ============================================================
# 鲲鹏 920 省级部署 — docker-compose.kunpeng.yml
# CPU: 华为鲲鹏 920 (ARM64), 64 核, NUMA
# OS:  openEuler 22.03 / 统信 UOS 服务器版 / 麒麟 V10
# GPU: Atlas 300I (可选, vLLM 推理加速)
# ============================================================

version: '3.9'

services:
  # ─── 前端 (Nginx ARM64) ───
  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    container_name: ecomind-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-kunpeng.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ecomind-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # ─── 后端 (FastAPI + Uvicorn) ───
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    container_name: ecomind-backend
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - CPU_ARCH=arm64
      - CPU_VENDOR=kunpeng
      - OLLAMA_HOST=http://ollama:11434
      - DB_TYPE=opengauss
      - DB_HOST=gaussdb
      - DB_PORT=5432
      - DB_NAME=ECOMIND
      - DB_USER=ecomind_admin
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      gaussdb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 32G
        reservations:
          cpus: '4'
          memory: 8G
    networks:
      - ecomind-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "30"

  # ─── 本地模型推理 (Ollama ARM64) ───
  ollama:
    image: ollama/ollama:0.9.0-arm64
    container_name: ecomind-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
      - ./ollama-setup.sh:/setup.sh:ro
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '32'
          memory: 64G
    networks:
      - ecomind-net
    entrypoint: ["/bin/sh", "-c", "/setup.sh && exec ollama serve"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 0"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ─── 向量模型 (BGE-M3 / GTE-Qwen2) ───
  ollama-embed:
    image: ollama/ollama:0.9.0-arm64
    container_name: ecomind-ollama-embed
    ports:
      - "11435:11434"
    volumes:
      - ollama-embed-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
    networks:
      - ecomind-net
    command: >
      sh -c "ollama pull bge-m3:567m && ollama pull gte-qwen2:1.5b && ollama serve"

  # ─── openGauss 数据库 (华为开源) ───
  gaussdb:
    image: opengauss/opengauss:5.0.1-arm64
    container_name: ecomind-gaussdb
    ports:
      - "5432:5432"
    environment:
      - GS_USER=ecomind_admin
      - GS_PASSWORD=${DB_PASSWORD:-Changeme123!}
      - GS_PORT=5432
      - GS_DB=ECOMIND
      - GS_ENABLE_SM4=on
    volumes:
      - gaussdb-data:/var/lib/opengauss/data
      - ./init-db/opengauss-init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
    networks:
      - ecomind-net
    healthcheck:
      test: ["CMD-SHELL", "gsql -d ECOMIND -c 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── 达梦 DM8 (审计日志专用) ───
  dameng:
    image: centos:7  # 达梦官方镜像需授权下载, 此处占位
    container_name: ecomind-dameng
    # 生产环境替换为达梦官方 ARM64 Docker 镜像
    # image: registry.dameng.com/dm8/dm8-arm64:8.1.3
    ports:
      - "5236:5236"
    volumes:
      - dameng-data:/opt/dmdbms/data
    environment:
      - DB_INSTANCE=ECOMIND_AUDIT
      - PAGE_SIZE=32
      - CASE_SENSITIVE=N
      - CHARSET=UTF-8
    networks:
      - ecomind-net

  # ─── Redis (缓存 & 消息队列) ───
  redis:
    image: redis:7.4-alpine-arm64
    container_name: ecomind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 4gb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - ecomind-net

  # ─── MinIO (对象存储, 文件/模型存储) ───
  minio:
    image: minio/minio:RELEASE.2025-05-14T21-25-00Z-arm64
    container_name: ecomind-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-MinioAdmin123}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - ecomind-net

  # ─── 达梦 DM8 (审计日志) ───
  # 达梦 ARM64 镜像需从达梦官网授权下载
  # 此处为部署说明, 实际部署时将下面的注释替换为达梦镜像

volumes:
  ollama-models:
    driver: local
  ollama-embed-models:
    driver: local
  gaussdb-data:
    driver: local
  dameng-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local

networks:
  ecomind-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
