# EcoMind OS Staging 环境 Nginx 配置
# 反向代理到 FastAPI 后端 + 静态资源服务

# 上游定义 — FastAPI 后端服务
upstream ecomind_backend {
    server api:8000;
    # 保持长连接，减少 TCP 握手开销
    keepalive 32;
}

# HTTP → HTTPS 重定向 (生产环境建议启用)
server {
    listen 80;
    server_name _;

    # Staging 环境可直接访问 HTTP，生产环境可取消注释以下重定向
    # return 301 https://$host$request_uri;

    # 访问日志
    access_log /var/log/nginx/ecomind_access.log combined;
    error_log /var/log/nginx/ecomind_error.log warn;

    # 主配置
    location / {
        proxy_pass http://ecomind_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 文件上传大小限制 (50MB)
        client_max_body_size 50m;
    }

    # SSE 流式响应 — 关闭 buffer 和 gzip
    location /api/chat/stream {
        proxy_pass http://ecomind_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关键: 禁用缓冲，确保 SSE 实时推送
        proxy_buffering off;
        proxy_cache off;

        # 禁用 gzip 压缩 (SSE 不能压缩)
        gzip off;

        # SSE 长连接超时 (10分钟)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 正确的 Content-Type
        proxy_set_header Accept-Encoding "";
        add_header X-Accel-Buffering no always;

        # WebSocket 升级头 (部分 SSE 实现需要)
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 文件上传限制
        client_max_body_size 50m;
    }

    # WebSocket 端点 — 专用路径优化
    location /ws {
        proxy_pass http://ecomind_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 必需头部
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WebSocket 长连接超时 (1小时)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查端点 — 不记录日志
    location /health {
        proxy_pass http://ecomind_backend;
        access_log off;
        log_not_found off;
    }

    # 前端静态资源 (build 产物)
    location /assets {
        alias /usr/share/nginx/html/assets;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 其他静态资源
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback — 所有非 API 请求返回 index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2
        font/ttf
        font/eot;

    # 日志格式定义
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
}

